# Akuji reads the gamepad itself. These bindings only give the title and
# option menus the arrow/Z/Enter keys they listen for; unmapped buttons stay
# inert in gptokeyb2 and are read natively in game.
[config]
deadzone = 12000

[controls]
up = "up"
down = "down"
left = "left"
right = "right"
# No "repeat": gptokeyb2's repeat toggle can lose the key-up when the stick
# returns to centre in the same loop iteration, leaving the key held.
left_analog = arrow_keys
a = "z"
start = "enter"
