[disp]
fullscreen=off

[device]
input=1

[music]
; gm = the Windows GS sound set the game was written for (default)
; gs = GeneralUser GS, a free GS-style bank shipped as the alternative
soundfont=gm
; off = dry, as the game has always sounded (default)
; on  = add FluidSynth's reverb and chorus
effects=off

[log]
; on writes akuji.log beside the game; --log on the command line does the same
enabled=off
; all, or any of: init, video, audio, music, input, data, settings
subsystems=all
